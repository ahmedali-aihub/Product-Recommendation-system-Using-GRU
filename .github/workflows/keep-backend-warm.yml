name: Keep backend warm

# Two free-tier idle timeouts to defeat, both on a ~15 min threshold:
# - Render spins the backend process down (next request pays a slow cold
#   start: importing TensorFlow + building the model).
# - Aiven powers the MySQL instance off (its hostname stops resolving
#   entirely until powered back on -- much worse than Render's cold start).
# /api/products exercises both the backend process AND a real DB query,
# so a single ping keeps both alive. /api/health would only cover Render.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend + database
        run: curl -fsS --max-time 100 "https://product-recommendation-system-using-gru.onrender.com/api/products?page=1&page_size=1"
